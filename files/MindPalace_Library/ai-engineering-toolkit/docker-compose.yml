version: '3.8'
services:
  # Language Models (vLLM, TP=2)
  deepseek-v4-pro:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    command: >
      --model deepseek-ai/DeepSeek-V4-Pro
      --tensor-parallel-size 2
      --quantization fp8
      --max-model-len 128000
      --gpu-memory-utilization 0.9
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}

  nemotron-3-ultra:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    command: >
      --model nvidia/Nemotron-3-Ultra
      --tensor-parallel-size 2
      --quantization fp8
      --max-model-len 1000000
      --gpu-memory-utilization 0.85
      --host 0.0.0.0
      --port 8001
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    ports:
      - "8001:8001"
    environment:
      - HF_TOKEN=${HF_TOKEN}

  # ComfyUI GPU 0 (Image models)
  comfyui-gpu0:
    image: ghcr.io/aeon-7/comfyui-aeon-spark:latest
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - SKIP_ABLITERATED=0
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/workspace/ComfyUI/models
      - ./output:/workspace/ComfyUI/output
      - ./custom_nodes:/workspace/ComfyUI/custom_nodes
    ports:
      - "8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              device_ids: ['0']

  # ComfyUI GPU 1 (Video models)
  comfyui-gpu1:
    image: ghcr.io/aeon-7/comfyui-aeon-spark:latest
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - SKIP_ABLITERATED=0
      - NVIDIA_VISIBLE_DEVICES=1
    volumes:
      - ./models:/workspace/ComfyUI/models
      - ./output:/workspace/ComfyUI/output
      - ./custom_nodes:/workspace/ComfyUI/custom_nodes
    ports:
      - "8189:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              device_ids: ['1']

  # OpenCode
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    volumes:
      - .:/workspace
      - ~/.config/opencode:/root/.config/opencode
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - deepseek-v4-pro
      - nemotron-3-ultra